name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CI has no LLM access, no API key and no real data (DESIGN §13.3).
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: check_private over every commit
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: python3 scripts/check_private.py --commits "$BASE" HEAD
      - name: gitleaks over the commits
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="${BASE:+$BASE..}HEAD" .

  decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: check_decisions
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/check_decisions.py --base "$(git merge-base "origin/$BASE_REF" HEAD)"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 scripts/check_decisions.py --base "$BEFORE"
          else
            python3 scripts/check_decisions.py
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: uv run pytest
